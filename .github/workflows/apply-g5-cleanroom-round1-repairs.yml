name: Apply G5 Science clean-room round 1 repairs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-g5-cleanroom-round1-repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: core/map-v1-foundation
      - name: Replace 15 direct-source items
        run: |
          python - <<'PY'
          from pathlib import Path

          common='grade:5,subject:"science",provenance:"original-synthetic",alignmentStatus:"development-needs-clean-room"'
          replacements={
          "g5s-002": f'''{{{common},id:"g5s-002",standard:"5.ESS.1.B.2",strand:"Earth & Space Science",dok:2,itemType:"bar_graph",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-stim-shadows",title:"Playground Shadows",text:"Students measured the length of the same flagpole's shadow on a clear day. At 9:00 a.m. it was 7.2 m long, at noon it was 2.1 m long, and at 3:00 p.m. it was 6.5 m long."}},prompt:"Enter the three measured shadow lengths, in order for 9:00 a.m., noon, and 3:00 p.m., to build a graph that reveals the daily shadow pattern.",fields:["9:00 a.m. shadow (m)","noon shadow (m)","3:00 p.m. shadow (m)"],scoring:{{answer:[7.2,2.1,6.5]}},rationale:"Representing all three measurements together reveals the daily pattern: the shadow is much shorter near noon than earlier or later."}},''',
          "g5s-030": f'''{{{common},id:"g5s-030",standard:"5.ESS.1.B.2",strand:"Earth & Space Science",dok:2,itemType:"bar_graph",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-stim-shadow-stick",title:"A Stick and Its Shadow",text:"Students place a 50 cm stick upright in the same sunny location and measure its shadow three times on one clear day. At 9:00 a.m. the shadow is 82 cm long. At 12:30 p.m. it is 31 cm long. At 4:00 p.m. it is 74 cm long. The stick is not moved between measurements."}},prompt:"Enter the three shadow lengths, in order for 9:00 a.m., 12:30 p.m., and 4:00 p.m., to build a graph that reveals the daily pattern.",fields:["9:00 a.m. shadow (cm)","12:30 p.m. shadow (cm)","4:00 p.m. shadow (cm)"],scoring:{{answer:[82,31,74]}},rationale:"Graphing the three measurements shows the shadow becoming shorter near midday and longer again later in the day."}},''',
          "g5s-cap-001": f'''{{{common},id:"g5s-cap-001",standard:"4.PS.3.B.1",strand:"Physical Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-cap-ice",title:"Melting Ice Investigation",text:"Students place identical 40 g ice cubes in three identical cups. Cup A is on a room-temperature table, Cup B is wrapped in cotton, and Cup C is placed near a sunny window. After 15 minutes, the students measure how much liquid water has formed: A = 12 g, B = 7 g, C = 24 g."}},prompt:"Which explanation best uses the results as evidence of an energy transformation?",options:["Cup C produced the most meltwater, supporting that light energy near the window was transferred and transformed into thermal energy that melted more ice.","Cup B produced the least meltwater, showing that cotton created new cold matter that permanently removed energy from the ice.","Cup A produced some meltwater, proving that all three cups received exactly the same amount and form of energy during the test.","The different meltwater masses show that melting can occur without any transfer or transformation of energy in the three cups."],scoring:{{answer:"Cup C produced the most meltwater, supporting that light energy near the window was transferred and transformed into thermal energy that melted more ice."}},rationale:"Cup C formed 24 g of liquid water, the greatest amount, consistent with more incoming light energy being converted to thermal energy and transferred to the ice."}},''',
          "g5s-cap-002": f'''{{{common},id:"g5s-cap-002",standard:"4.PS.3.B.1",strand:"Physical Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-cap-ice",title:"Melting Ice Investigation",text:"Students place identical 40 g ice cubes in three identical cups. Cup A is on a room-temperature table, Cup B is wrapped in cotton, and Cup C is placed near a sunny window. After 15 minutes, the students measure how much liquid water has formed: A = 12 g, B = 7 g, C = 24 g."}},prompt:"Cup C formed 17 g more liquid water than Cup B. What does that difference best support?",options:["More energy reached the ice in Cup C, producing a greater energy change and more melting than in the insulated Cup B.","Cup C created 17 g of new matter from sunlight, while Cup B destroyed the same amount of matter inside the cotton wrap.","The 17 g difference shows that Cup B received more energy than Cup C even though less of its ice changed to liquid water.","The 17 g difference proves that energy cannot affect changes between solid and liquid water under the tested conditions."],scoring:{{answer:"More energy reached the ice in Cup C, producing a greater energy change and more melting than in the insulated Cup B."}},rationale:"The larger amount melted in Cup C is evidence that more energy was transferred to that ice than to the insulated ice in Cup B."}},''',
          "g5s-cap-003": f'''{{{common},id:"g5s-cap-003",standard:"4.PS.3.B.1",strand:"Physical Science",dok:3,itemType:"multi_select",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-cap-ice",title:"Melting Ice Investigation",text:"Students place identical 40 g ice cubes in three identical cups. Cup A is on a room-temperature table, Cup B is wrapped in cotton, and Cup C is placed near a sunny window. After 15 minutes, the students measure how much liquid water has formed: A = 12 g, B = 7 g, C = 24 g."}},prompt:"Which two statements belong in an evidence-based explanation of the energy changes in this investigation? Select two.",options:["Cup C formed 24 g of liquid water, more than either other cup from the same starting ice mass.","Energy transferred to ice can change it from solid to liquid, and light near the window can be transformed into thermal energy.","Cotton must create new matter because Cup B formed less liquid water than the other two cups.","Because all ice cubes began at 40 g, every cup must have received exactly the same amount of energy."],scoring:{{answers:["Cup C formed 24 g of liquid water, more than either other cup from the same starting ice mass.","Energy transferred to ice can change it from solid to liquid, and light near the window can be transformed into thermal energy."]}},rationale:"A sound explanation combines the measured difference in melting with the principle that transferred energy can change the state of matter and that light can become thermal energy."}},''',
          "g5s-cap-008": f'''{{{common},id:"g5s-cap-008",standard:"5.LS.2.B.1",strand:"Life Science",dok:2,itemType:"matching",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-sem-terrarium-matter",title:"Matter Through a Terrarium",text:"A terrarium model contains plants, plant-eating insects, small predators, decomposers, air, water, and soil. A safe tracer begins in plant material. Later measurements find 24 tracer units in plant-eating insects, 9 in predators, and 6 in decomposer material."}},prompt:"Complete a model of one supported path of tracer matter by matching each step to the correct component.",pairs:[{{key:"A",label:"Step 1: producer material"}},{{key:"B",label:"Step 2: organism that eats the producer"}},{{key:"C",label:"Step 3: organism that eats the plant-eating consumer"}}],choices:["plant material","plant-eating insects","predators"],scoring:{{matches:{{A:"plant material",B:"plant-eating insects",C:"predators"}}}},rationale:"The tracer begins in plant material, then appears in plant-eating insects and predators, modeling movement of matter through feeding relationships."}},''',
          "g5s-div-a001": f'''{{{common},id:"g5s-div-a001",standard:"4.PS.3.B.1",strand:"Physical Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-div-lamp",title:"Lamp and Surface Test",text:"Students place equal-size black, white, and silver cards the same distance from a lamp. All cards begin at 22°C. After 10 minutes, the black card is 34°C, the white card is 28°C, and the silver card is 25°C."}},prompt:"Which explanation best uses the temperature data as evidence of an energy transformation?",options:["The black card warmed the most, supporting that more lamp light was absorbed and transformed into thermal energy in that card.","The silver card warmed the least, proving that it created cold matter that removed all incoming light energy from the test.","All three cards began at 22°C, so the different final temperatures show that no energy was transferred from the lamp.","The white card reached 28°C, proving that temperature changes are unrelated to absorption or transformation of light energy."],scoring:{{answer:"The black card warmed the most, supporting that more lamp light was absorbed and transformed into thermal energy in that card."}},rationale:"The black card had the greatest temperature increase, evidence that absorbed light energy was transformed into thermal energy."}},''',
          "g5s-div-a002": f'''{{{common},id:"g5s-div-a002",standard:"4.PS.3.B.1",strand:"Physical Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-div-lamp",title:"Lamp and Surface Test",text:"Students place equal-size black, white, and silver cards the same distance from a lamp. All cards begin at 22°C. After 10 minutes, the black card is 34°C, the white card is 28°C, and the silver card is 25°C."}},prompt:"The white card warmed from 22°C to 28°C. Which statement best explains what this change shows about energy?",options:["Some light energy from the lamp was absorbed by the card and transformed into thermal energy, raising its temperature.","The card created 6°C of new matter, and that new matter caused the measured temperature to increase during the test.","The card lost all of its thermal energy to the lamp, so its temperature rose even though no energy entered the card.","The 6°C increase shows that light and thermal energy cannot be transferred or transformed when an object is illuminated."],scoring:{{answer:"Some light energy from the lamp was absorbed by the card and transformed into thermal energy, raising its temperature."}},rationale:"The temperature increase is evidence that energy from the lamp was transferred to the card and transformed into thermal energy."}},''',
          "g5s-div-a008": f'''{{{common},id:"g5s-div-a008",standard:"5.LS.1.C.1",strand:"Life Science",dok:3,itemType:"multi_select",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-sem-plant-material-c",title:"Seedling Mass Study",text:"A seedling begins with a dry mass of 3 g in 450 g of dry soil. After several weeks of receiving water while exposed to air and light, the plant's dry mass is 16 g and the dry soil mass is 448 g."}},prompt:"Which two observations should be used together to support the argument that the plant's added material came chiefly from air and water rather than soil? Select two.",options:["The plant gained 13 g of dry mass while the dry soil lost only 2 g.","The plant received water and remained exposed to air while it grew.","The pot contained much more soil mass than plant mass at the beginning of the study.","The investigation lasted several weeks, regardless of what happened to plant and soil mass."],scoring:{{answers:["The plant gained 13 g of dry mass while the dry soil lost only 2 g.","The plant received water and remained exposed to air while it grew."]}},rationale:"The large plant gain compared with the small soil loss, together with access to air and water, supports the Grade 5 claim about the chief sources of plant growth material."}},''',
          "g5s-div-a014": f'''{{{common},id:"g5s-div-a014",standard:"4.ESS.2.A.1",strand:"Earth & Space Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-div-creek",title:"Creek Bank Test",text:"Students pour the same amount of water over equal trays of the same soil. Tray A is bare and loses 76 g of soil. Tray B has scattered grass and loses 43 g. Tray C has dense grass and loses 18 g."}},prompt:"Which explanation best uses the investigation as evidence for how moving water changes a soil surface?",options:["Runoff carried soil from every tray, and the smaller losses with more grass show that plant cover reduced the erosion under the tested conditions.","Runoff added soil to every tray, and the different grass covers created the measured soil instead of affecting erosion by moving water.","The equal water amounts show that moving water cannot change a soil surface, so the measured soil losses must be unrelated to erosion.","The grass stopped all water movement in the covered trays, so only the bare tray provided any evidence about how erosion changes soil."],scoring:{{answer:"Runoff carried soil from every tray, and the smaller losses with more grass show that plant cover reduced the erosion under the tested conditions."}},rationale:"The measured soil carried away by runoff is evidence of erosion, and the pattern shows that greater grass cover reduced soil loss in the model."}},''',
          "g5s-div-a018": f'''{{{common},id:"g5s-div-a018",standard:"4.ESS.2.A.1",strand:"Earth & Space Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],prompt:"Which investigation would best provide evidence for how moving water can shape a soil surface by erosion?",options:["Measure identical soil trays before and after equal amounts of water flow across them, recording how much soil is moved and where it is deposited.","Compare the colors of several dry soils without adding water or measuring any change in the soil surfaces during the investigation.","Place unrelated rocks in different rooms and record room temperature without observing water, weathering, erosion, or surface change.","Name examples of erosion from memory without measuring a model, simulation, or natural process that moves or changes soil."],scoring:{{answer:"Measure identical soil trays before and after equal amounts of water flow across them, recording how much soil is moved and where it is deposited."}},rationale:"Measuring soil movement and surface change before and after controlled water flow directly supplies evidence of erosion shaping a surface."}},''',
          "g5s-div-b008": f'''{{{common},id:"g5s-div-b008",standard:"5.LS.2.B.1",strand:"Life Science",dok:2,itemType:"matching",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-sem-matter-tracer",title:"Tracing Matter Through a Food Web",text:"Students use a safe tracer to follow carbon-containing matter that begins in plant leaves. Later they detect 30 tracer units in caterpillars that ate the leaves, 12 units in birds that ate caterpillars, and 8 units in decomposer samples from wastes and dead material."}},prompt:"Complete a model of one supported path of tracer matter by matching each step to the correct part of the food web.",pairs:[{{key:"A",label:"Step 1: producer material"}},{{key:"B",label:"Step 2: plant-eating consumer"}},{{key:"C",label:"Step 3: consumer that eats the plant-eater"}}],choices:["plant leaves","caterpillars","birds"],scoring:{{matches:{{A:"plant leaves",B:"caterpillars",C:"birds"}}}},rationale:"The tracer starts in plant leaves, appears in caterpillars that eat the leaves, and then appears in birds that eat caterpillars, modeling matter movement."}},''',
          "g5s-div-b013": f'''{{{common},id:"g5s-div-b013",standard:"4.ESS.2.A.1",strand:"Earth & Space Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-div-b-rain",title:"Rainfall and Runoff",text:"Students pour 300 mL of water over equal soil trays tilted at 5°, 15°, and 25°. Collected runoff contains 9 g, 23 g, and 41 g of soil, respectively."}},prompt:"Which feature of the investigation makes the results useful for testing how slope affects erosion by moving water?",options:["The trays use equal soil and equal water amounts while the slope angle is changed among the trials.","Each tray receives a different soil type and a different water amount at the same time that its slope is changed.","The students change the slope but do not measure any soil carried away in runoff from any of the three trays.","The trays are compared only by color after the test, without controlling soil, water, or measuring erosion-related changes."],scoring:{{answer:"The trays use equal soil and equal water amounts while the slope angle is changed among the trials."}},rationale:"Holding soil and water amount constant while varying slope isolates slope as the tested factor and lets runoff soil provide erosion evidence."}},''',
          "g5s-div-b014": f'''{{{common},id:"g5s-div-b014",standard:"4.ESS.2.A.1",strand:"Earth & Space Science",dok:3,itemType:"multiple_choice",points:1,sessionEligibility:[1,2],stimulus:{{id:"g5s-div-b-rain",title:"Rainfall and Runoff",text:"Students pour 300 mL of water over equal soil trays tilted at 5°, 15°, and 25°. Collected runoff contains 9 g, 23 g, and 41 g of soil, respectively."}},prompt:"Which explanation best uses the measurements as evidence for how runoff erosion changed the tested soil surfaces?",options:["The 25° tray lost 41 g while the 5° tray lost 9 g, supporting that steeper tested slopes experienced more soil movement by runoff.","The 25° tray lost 41 g while the 5° tray lost 9 g, proving that water added new soil to steeper surfaces during the test.","All three trays received 300 mL of water, so the different soil losses show that runoff did not move or change soil on any surface.","The 15° tray lost 23 g, proving that slope angle is unrelated to erosion and that all soil surfaces changed by the same amount."],scoring:{{answer:"The 25° tray lost 41 g while the 5° tray lost 9 g, supporting that steeper tested slopes experienced more soil movement by runoff."}},rationale:"The controlled runoff model shows greater measured soil movement as slope increases, evidence of erosion changing the soil surfaces."}},''',
          "g5s-div-b016": f'''{{{common},id:"g5s-div-b016",standard:"5.ESS.1.B.2",strand:"Earth & Space Science",dok:2,itemType:"bar_graph",points:1,sessionEligibility:[1,2],prompt:"A student measures the same stick's shadow as 76 cm at 9:00 a.m., 29 cm at noon, and 70 cm at 4:00 p.m. Enter the three values in time order to build a graph that reveals the daily shadow pattern.",fields:["9:00 a.m. shadow (cm)","noon shadow (cm)","4:00 p.m. shadow (cm)"],scoring:{{answer:[76,29,70]}},rationale:"Representing the measurements together reveals a shorter shadow near noon and longer shadows earlier and later in the day."}},'''
          }

          files=list(Path('data/grade-5').glob('science*.js'))
          found={key:0 for key in replacements}
          changed=[]
          for path in files:
              lines=path.read_text().splitlines()
              out=[]
              dirty=False
              for line in lines:
                  hits=[key for key in replacements if f'id:"{key}"' in line]
                  if hits:
                      if len(hits)!=1:
                          raise SystemExit(f'{path}: ambiguous replacement hits {hits}')
                      key=hits[0]
                      found[key]+=1
                      out.append(replacements[key])
                      dirty=True
                  else:
                      out.append(line)
              if dirty:
                  path.write_text('\n'.join(out)+'\n')
                  changed.append(str(path))
          bad={k:v for k,v in found.items() if v!=1}
          if bad:
              raise SystemExit(f'Expected exactly one source occurrence per repair; got {bad}')
          print('Updated:',*changed,sep='\n- ')
          PY
      - name: Commit repairs to branch
        run: |
          set -euo pipefail
          git config user.name "MAP clean-room repair"
          git config user.email "actions@users.noreply.github.com"
          git add data/grade-5/science*.js
          git diff --cached --check
          git commit -m "Repair G5 Science clean-room alignment findings"
          git push origin HEAD:core/map-v1-foundation
