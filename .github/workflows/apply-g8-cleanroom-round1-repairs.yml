name: Apply G8 Science clean-room round 1 repairs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-g8-cleanroom-round1-repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: core/map-v1-foundation
      - name: Replace six direct-source items
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
          "g8s-017": '''{...base,id:"g8s-017",standard:"6-8.LS2.A.1",strand:"Life Science",dok:2,itemType:"bar_graph",points:1,sessionEligibility:[1,2],stimulus:resourcePopulation,prompt:"Graph the population evidence by entering the beetle counts for 5, 10, 20, and 30 g of food per day, in that order, so the effect of resource availability can be analyzed.",fields:["5 g food/day","10 g food/day","20 g food/day","30 g food/day"],scoring:{answer:[18,31,47,49]},rationale:"Representing all four resource levels and population counts reveals the strong increase at lower food levels and the small increase from 20 to 30 g/day."},''',
          "g8s-cap-002": '''{...base,id:"g8s-cap-002",standard:"6-8.LS2.A.1",strand:"Life Science",dok:2,itemType:"bar_graph",points:1,stimulus:pond,prompt:"Graph the population evidence by entering the snail counts for 2, 5, 10, and 15 g of algae food per day, in that order, so the resource-availability pattern can be analyzed.",fields:["2 g algae/day","5 g algae/day","10 g algae/day","15 g algae/day"],scoring:{answer:[11,24,39,41]},rationale:"Representing all food levels and snail counts shows increasing population with greater food availability and little additional increase at the highest level."},''',
          "g8s-cap-004": '''{...base,id:"g8s-cap-004",standard:"6-8.LS2.C.1",strand:"Life Science",dok:3,itemType:"multiple_choice",points:1,stimulus:prairie,prompt:"Which evidence-based argument is best supported by the two five-year periods?",options:["The drier period had lower rainfall, lower plant biomass, and fewer grass-eating insects, supporting the argument that changes in physical and biological ecosystem components may have affected the insect population.","Because insect counts changed, rainfall and plant biomass cannot have any relationship to population changes in the prairie ecosystem.","The later period proves that every decrease in rainfall causes exactly the same insect decline in every ecosystem regardless of plant resources.","The data show that insect population increased when rainfall and plant biomass decreased, so fewer resources must always increase herbivore populations."],scoring:{answer:"The drier period had lower rainfall, lower plant biomass, and fewer grass-eating insects, supporting the argument that changes in physical and biological ecosystem components may have affected the insect population."},rationale:"The argument uses empirical changes in rainfall, plant biomass, and insect counts while avoiding a causal claim stronger than the comparative evidence supports."},''',
          "g8s-cap-005": '''{...base,id:"g8s-cap-005",standard:"6-8.LS2.C.1",strand:"Life Science",dok:3,itemType:"multi_select",points:1,stimulus:prairie,prompt:"Which two measured changes should be cited as empirical evidence in an argument that the later ecosystem conditions may have affected the grass-eating insect population? Select two.",options:["Average spring rainfall decreased from 42 cm to 27 cm and plant biomass was lower in the later period.","Mean insect count decreased from 310 to 185 insects per plot in the later period.","The field notebooks used in the later period may have had different cover colors.","The study periods each lasted five years, so ecosystem changes cannot be related to population evidence."],scoring:{answers:["Average spring rainfall decreased from 42 cm to 27 cm and plant biomass was lower in the later period.","Mean insect count decreased from 310 to 185 insects per plot in the later period."]},rationale:"An empirical argument needs evidence for both the ecosystem-component changes and the population response observed in the same comparison."},''',
          "g8s-div-a008": '''{...base,id:"g8s-div-a008",standard:"6-8.LS2.A.1",strand:"Life Science",dok:2,itemType:"bar_graph",points:1,stimulus:algae,prompt:"Graph the population evidence by entering the snail counts for 2, 6, 12, and 20 g of algae food per day, in that order, so the effect of food-resource availability can be analyzed.",fields:["2 g algae/day","6 g algae/day","12 g algae/day","20 g algae/day"],scoring:{answer:[9,22,36,38]},rationale:"Representing the four food levels and population counts shows a strong increase in snails as food rises, followed by only a small increase from 12 to 20 g/day."},''',
          "g8s-div-b008": '''{...base,id:"g8s-div-b008",standard:"6-8.LS2.A.1",strand:"Life Science",dok:2,itemType:"bar_graph",points:1,stimulus:prairie,prompt:"Graph the resource-population evidence by entering the grasshopper counts for plots with 420, 270, and 140 g/m² of plant biomass, in that order, so the relationship between available plant resources and consumer population can be analyzed.",fields:["420 g/m² plant biomass","270 g/m² plant biomass","140 g/m² plant biomass"],scoring:{answer:[58,39,21]},rationale:"Representing all three biomass and grasshopper-count pairs shows that lower measured plant biomass is associated with fewer grasshoppers in these plots."},'''
          }
          files=list(Path('data/grade-8').glob('science*.js'))
          found={key:0 for key in replacements}
          changed=[]
          for path in files:
              lines=path.read_text().splitlines()
              out=[]; dirty=False
              for line in lines:
                  hits=[key for key in replacements if f'id:"{key}"' in line]
                  if hits:
                      if len(hits)!=1: raise SystemExit(f'{path}: ambiguous replacement hits {hits}')
                      key=hits[0]; found[key]+=1; out.append(replacements[key]); dirty=True
                  else: out.append(line)
              if dirty:
                  path.write_text('\n'.join(out)+'\n'); changed.append(str(path))
          bad={k:v for k,v in found.items() if v!=1}
          if bad: raise SystemExit(f'Expected exactly one source occurrence per repair; got {bad}')
          print('Updated:',*changed,sep='\n- ')
          PY
      - name: Commit repairs to branch
        run: |
          set -euo pipefail
          git config user.name "MAP clean-room repair"
          git config user.email "actions@users.noreply.github.com"
          git add data/grade-8/science*.js
          git diff --cached --check
          git commit -m "Repair G8 Science clean-room alignment findings"
          git push origin HEAD:core/map-v1-foundation
