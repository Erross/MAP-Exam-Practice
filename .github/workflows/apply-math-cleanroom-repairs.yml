name: Apply G6/G8 Math clean-room repairs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-math-cleanroom-repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: core/map-v1-foundation
          fetch-depth: 1
      - name: Reconstruct and verify reviewed patch
        run: |
          set -euo pipefail
          cat .tmp-cleanroom/math-patch-*.b64 > /tmp/math.patch.gz.b64
          base64 -d /tmp/math.patch.gz.b64 > /tmp/math.patch.gz
          gunzip -c /tmp/math.patch.gz > /tmp/math.patch
          test "$(sha256sum /tmp/math.patch | cut -d' ' -f1)" = "dce51a172932c74936709d6ca7284a945e9cb86d82aa1257c5b9020781e71041"
          git apply --check /tmp/math.patch
          git apply /tmp/math.patch
          git diff --check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run deterministic tests before push
        run: npm test
      - name: Commit repaired Math source
        run: |
          set -euo pipefail
          git config user.name "MAP clean-room repair"
          git config user.email "actions@users.noreply.github.com"
          git add data/grade-6/math*.js data/grade-8/math*.js
          git commit -m "Repair G6 and G8 Math clean-room findings"
          git push origin HEAD:core/map-v1-foundation
