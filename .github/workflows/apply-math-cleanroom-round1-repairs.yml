name: Apply G3-G5 Math clean-room repairs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-math-cleanroom-round1-repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: core/map-v1-foundation
      - name: Repair eight clean-room findings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data/grade-3/math-expansion.js')
          s=p.read_text()
          old='{...base,id:"g3m-pe-107a",standard:"3.GM.A.2",strand:"Performance Event",reportingCategory:"Geometry, Measurement & Data",dok:2,itemType:"matching",points:2,sessionEligibility:[3],stimulus:cardShapes,prompt:"Match each shape name with a property that is always true.",pairs:[{key:"A",label:"Square"},{key:"B",label:"Rectangle"},{key:"C",label:"Rhombus"}],choices:["four equal sides","four right angles","four sides"],scoring:{matches:{A:"four equal sides",B:"four right angles",C:"four sides"}},rationale:"Squares always have four equal sides, rectangles always have four right angles, and rhombuses are four-sided figures."},'
          new='{...base,id:"g3m-pe-107a",standard:"3.GM.A.2",strand:"Performance Event",reportingCategory:"Geometry, Measurement & Data",dok:2,itemType:"matching",points:2,sessionEligibility:[3],stimulus:cardShapes,prompt:"Match each description with the most specific shape name.",pairs:[{key:"A",label:"Four equal sides and four right angles"},{key:"B",label:"Four right angles, with adjacent sides of different lengths"},{key:"C",label:"Four equal sides, with no right angles"}],choices:["Square","Rectangle that is not a square","Rhombus that is not a square"],scoring:{matches:{A:"Square",B:"Rectangle that is not a square",C:"Rhombus that is not a square"}},rationale:"A square has four equal sides and four right angles. A non-square rectangle has four right angles with unequal adjacent sides. A non-square rhombus has four equal sides without four right angles."},'
          if old not in s: raise SystemExit('g3m-pe-107a source did not match expected pre-repair state')
          p.write_text(s.replace(old,new))

          for path in [Path('data/grade-4/math-expansion.js'),Path('data/grade-4/math-pe-expansion.js')]:
              s=path.read_text()
              for id in ['g4m-033','g4m-pe-104a','g4m-pe-104b','g4m-pe-105a','g4m-pe-105b']:
                  marker=f'id:"{id}",standard:"4.RA.C.6"'
                  if marker in s: s=s.replace(marker,f'id:"{id}",standard:"4.RA.C.7"')
              path.write_text(s)

          p=Path('data/grade-5/math-diversity-nf.js')
          s=p.read_text()
          for id in ['g5m-div-f003','g5m-div-f004']:
              marker=f'id:"{id}",standard:"5.NF.B.4"'
              if marker not in s: raise SystemExit(f'{id} source did not match expected pre-repair state')
              s=s.replace(marker,f'id:"{id}",standard:"5.NF.B.6"')
          p.write_text(s)
          PY
      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name "MAP clean-room repair"
          git config user.email "actions@users.noreply.github.com"
          git add data/grade-3/math-expansion.js data/grade-4/math-expansion.js data/grade-4/math-pe-expansion.js data/grade-5/math-diversity-nf.js
          git diff --cached --check
          git commit -m "Repair G3-G5 Math clean-room findings"
          git push origin HEAD:core/map-v1-foundation
