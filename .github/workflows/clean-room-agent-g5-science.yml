name: Clean-room agent — Grade 5 Science

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/clean-room-agent-g5-science.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  blind-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate isolated blind packet and review in chunks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN=/tmp/map-cleanroom-g5-science
          mkdir -p "$CLEAN"
          node scripts/clean-room-review-template.mjs --assessment=g5-science > "$CLEAN/full.json"
          cp js/science-semantic-review.js "$CLEAN/expectations.js"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/map-cleanroom-g5-science')
          doc=json.loads((root/'full.json').read_text())
          items=doc['items']
          for start in range(0,len(items),20):
              chunk={k:v for k,v in doc.items() if k!='items'}
              chunk['items']=items[start:start+20]
              (root/f'chunk-{start//20+1:02d}.json').write_text(json.dumps(chunk,indent=2,ensure_ascii=False)+'\n')
          PY
          cat > "$CLEAN/REVIEWER.md" <<'EOF'
          You are the independent clean-room content reviewer for one chunk of Missouri Grade 5 MAP Science practice items.

          NON-NEGOTIABLE BLIND RULES:
          - You have not authored these items.
          - Do not seek or infer any repository answer key, scoring object, rationale, prior audit, PR description, test result, or author conclusion.
          - Do not access GitHub, the source repository, parent directories, or any file other than the chunk JSON and expectations.js in this directory.
          - The supplied expectations.js contains source-controlled Missouri expectation definitions only; it contains no item answer keys.
          - You may consult current official Missouri DESE material at https://dese.mo.gov if needed.

          REVIEW EVERY ITEM, independently. Do not blanket-pass.
          For each item, edit ONLY its review object:
          - reviewerAnswer: independently solve the item. For multiple choice/dropdown/hot text use the exact displayed option string. For multi-select use an array of the exact selected strings. For numeric items use a number. For matching use an object mapping each displayed pair key to the exact choice string. For graph/data-entry items use the ordered numeric array implied by fields. For constructed_response, write a concise string describing the response elements you independently expect a fully correct answer to contain.
          - correctnessVerdict: pass/finding
          - ambiguityVerdict: pass/finding
          - gradeFitVerdict: pass/finding
          - standardAlignmentVerdict: pass/finding
          - notes: concise explanation for every finding; otherwise it may remain empty.

          Judge factual/mathematical correctness, whether all distractors are actually wrong, ambiguity, Grade 5 reading/science appropriateness, and substantive alignment to the stated Missouri expectation—not merely whether the code looks plausible. If an item only asks trivial arithmetic or population/food effects while the expectation requires a different scientific idea, mark alignment finding.

          Do not change item content, metadata, order, IDs, or any top-level fields. When done, write valid JSON back to the same chunk file and verify every review field is complete.
          EOF
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          # Keep directory traversal available to the runner but make every authoring file unreadable to the reviewer.
          lock_source
          for chunk in chunk-*.json; do
            echo "Reviewing $chunk"
            copilot -s --model=gpt-5.2 --no-ask-user \
              --allow-tool='read,write,web_fetch' \
              --allow-url=https://dese.mo.gov \
              --deny-url=github.com --deny-url=api.github.com \
              -p "Read REVIEWER.md, expectations.js, and $chunk. Perform the complete blind review exactly as instructed and write the completed review objects back into $chunk. Do not stop until every item in this chunk is reviewed."
          done
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('/tmp/map-cleanroom-g5-science')
          full=json.loads((root/'full.json').read_text())
          reviews={}
          for p in sorted(root.glob('chunk-*.json')):
              d=json.loads(p.read_text())
              for item in d['items']:
                  reviews[item['id']]=item['review']
          missing=[]
          for item in full['items']:
              r=reviews.get(item['id'])
              if not r:
                  missing.append(item['id']); continue
              item['review']=r
              required=['reviewerAnswer','correctnessVerdict','ambiguityVerdict','gradeFitVerdict','standardAlignmentVerdict']
              if any(r.get(k) in (None,'') for k in required): missing.append(item['id'])
          if missing:
              print('Incomplete reviewer output:',missing,file=sys.stderr); sys.exit(2)
          (root/'completed-blind.json').write_text(json.dumps(full,indent=2,ensure_ascii=False)+'\n')
          PY
          unlock_source
          trap - EXIT
      - name: Upload completed blind review
        uses: actions/upload-artifact@v4
        with:
          name: g5-science-completed-blind
          path: /tmp/map-cleanroom-g5-science/completed-blind.json
          if-no-files-found: error
          retention-days: 30

  rubric-review:
    needs: blind-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: g5-science-completed-blind
          path: /tmp/g5-blind
      - name: Seal blind phase
        run: |
          mkdir -p /tmp/map-cleanroom-g5-rubric
          node scripts/seal-clean-room-review.mjs /tmp/g5-blind/completed-blind.json > /tmp/map-cleanroom-g5-rubric/sealed.json
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Independently review exposed manual rubrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN=/tmp/map-cleanroom-g5-rubric
          cat > "$CLEAN/RUBRIC_REVIEWER.md" <<'EOF'
          You are the second phase of an independent clean-room review. The blind answers and content judgments are already cryptographically sealed in sealed.json. Auto-scored answer keys and rationales are still absent.

          Review ONLY the manualRubrics entries against each constructed-response prompt and the corresponding independently committed reviewerAnswer inside blindReview. For each manualRubrics entry, edit ONLY review.manualRubricVerdict to pass or finding and review.notes. A pass means the rubric fairly captures the scientifically correct response requirements, matches the stated point value, is unambiguous, and is grade appropriate. A finding requires a concise explanation.

          Do not modify blindReview, blindReviewFingerprint, any rubric text, IDs, points, or other fields. Do not access GitHub or any parent/source repository files. Write valid JSON back to sealed.json and complete all manual rubric reviews.
          EOF
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          lock_source
          copilot -s --model=gpt-5.2 --no-ask-user \
            --allow-tool='read,write' \
            --deny-url=github.com --deny-url=api.github.com \
            -p "Read RUBRIC_REVIEWER.md and sealed.json. Complete every manual rubric review exactly as instructed, writing the results back to sealed.json."
          python - <<'PY'
          import json,sys
          p='/tmp/map-cleanroom-g5-rubric/sealed.json'
          d=json.load(open(p))
          bad=[x['id'] for x in d.get('manualRubrics',[]) if x.get('review',{}).get('manualRubricVerdict') not in ('pass','finding')]
          if bad:
              print('Incomplete manual rubric reviews:',bad,file=sys.stderr); sys.exit(2)
          PY
          unlock_source
          trap - EXIT
      - name: Upload sealed reviewed packet
        uses: actions/upload-artifact@v4
        with:
          name: g5-science-sealed-review
          path: /tmp/map-cleanroom-g5-rubric/sealed.json
          if-no-files-found: error
          retention-days: 30

  reconcile:
    needs: rubric-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: g5-science-sealed-review
          path: /tmp/g5-sealed
      - name: Reconcile sealed independent review against keyed bank
        run: |
          set +e
          node scripts/reconcile-clean-room-review.mjs /tmp/g5-sealed/sealed.json > /tmp/g5-reconciliation.json
          code=$?
          echo "RECON_CODE=$code" >> "$GITHUB_ENV"
          cat /tmp/g5-reconciliation.json
          exit 0
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: g5-science-reconciliation
          path: /tmp/g5-reconciliation.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce clean-room result
        run: |
          test "$RECON_CODE" = "0"
