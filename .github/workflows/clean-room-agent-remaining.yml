name: Clean-room agents — remaining MAP banks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/clean-room-agent-remaining.yml
      - data/**
      - js/banks.js
      - js/science-semantic-review.js
      - scripts/clean-room-manifest.mjs
      - scripts/clean-room-review-template.mjs
      - scripts/seal-clean-room-review.mjs
      - scripts/reconcile-clean-room-review.mjs

permissions:
  contents: read
  copilot-requests: write

jobs:
  clean-room:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        assessment:
          - g3-ela
          - g3-math
          - g4-ela
          - g4-math
          - g5-ela
          - g5-math
          - g6-ela
          - g6-math
          - g7-ela
          - g7-math
          - g8-ela
          - g8-math
          - g8-science
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSESSMENT: ${{ matrix.assessment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate isolated blind packet
        run: |
          set -euo pipefail
          CLEAN="/tmp/map-cleanroom-$ASSESSMENT"
          mkdir -p "$CLEAN"
          node scripts/clean-room-review-template.mjs --assessment="$ASSESSMENT" > "$CLEAN/full.json"
          if [[ "$ASSESSMENT" == "g8-science" ]]; then
            cp js/science-semantic-review.js "$CLEAN/science-expectations.js"
          fi
          python - <<'PY'
          import json, os, pathlib
          assessment=os.environ['ASSESSMENT']
          root=pathlib.Path('/tmp')/f'map-cleanroom-{assessment}'
          doc=json.loads((root/'full.json').read_text())
          items=doc['items']
          for start in range(0,len(items),25):
              chunk={k:v for k,v in doc.items() if k!='items'}
              chunk['items']=items[start:start+25]
              (root/f'chunk-{start//25+1:02d}.json').write_text(json.dumps(chunk,indent=2,ensure_ascii=False)+'\n')
          grade=doc['grade']; subject=doc['subject']
          landing={
            'ela':'https://dese.mo.gov/college-career-readiness/curriculum/english-language-arts',
            'math':'https://dese.mo.gov/college-career-readiness/curriculum/mathematics',
            'science':'https://dese.mo.gov/college-career-readiness/curriculum/science'
          }[subject]
          (root/'OFFICIAL_CONTEXT.md').write_text(
            f'Assessment: {assessment}\nGrade: {grade}\nSubject: {subject}\n'
            f'Official Missouri DESE curriculum/item-specification landing page: {landing}\n'
            'For standard alignment, independently consult current Missouri DESE item specifications/learning standards as needed. Do not use repository claims or prior audit conclusions as authority.\n'
          )
          PY
          cat > "$CLEAN/REVIEWER.md" <<'EOF'
          You are an independent clean-room reviewer of one chunk of an unofficial Missouri MAP Grade-Level practice bank. You did not author the bank.

          BLINDNESS IS NON-NEGOTIABLE:
          - Never seek, infer, or access repository answer keys, scoring objects, rationales, prior audits, PR text, tests, author notes, or GitHub content.
          - Work only from REVIEWER.md, OFFICIAL_CONTEXT.md, the assigned chunk JSON, and science-expectations.js when present.
          - You may independently consult current official Missouri DESE material at dese.mo.gov. Do not use third-party answer sites.
          - Do not assume the item is correct because it exists. Solve/reason independently first.

          REVIEW EVERY ITEM IN THE CHUNK. Edit ONLY each item's review object.

          reviewerAnswer format:
          - multiple_choice, dropdown, hot_text, hotspot: exact displayed option/region value string.
          - multi_select: JSON array of the exact selected strings.
          - ebsr: JSON array in part order; each entry is the exact selected string, or an array of exact strings for a multi-select part.
          - numeric_input, number_line, angle_input: JSON number.
          - coordinate_point: {"x":number,"y":number}.
          - coordinate_line: {"x1":number,"y1":number,"x2":number,"y2":number}.
          - matching, matching_table: JSON object mapping each displayed pair/row key to the exact choice value.
          - drag_drop: JSON array of token strings in the correct order.
          - line_plot, bar_graph: JSON array of numeric values in displayed field order.
          - clock_input: {"hour":number,"minute":number}.
          - constructed_response: concise prose stating the independently expected response elements/scoring criteria for a fully correct response.

          Set correctnessVerdict, ambiguityVerdict, gradeFitVerdict, and standardAlignmentVerdict to exactly "pass" or "finding". Put a concise explanation in notes for every finding.

          Quality rules:
          - Independently recompute every quantitative item; do not accept arithmetic by inspection.
          - Check that every distractor is actually wrong and that the keyed response is not merely the least-bad option.
          - Flag ambiguity when more than one response could reasonably be credited from the wording/stimulus.
          - Judge vocabulary, reading load, prerequisite knowledge, numerical complexity, and task demand for the stated grade.
          - For ELA, verify passage evidence really supports the answer and judge text/task complexity; do not assume a literary interpretation is unique when the passage does not make it so.
          - For Math, verify operations, units, diagrams/data, constraints, and whether the task actually measures the stated expectation rather than incidental arithmetic.
          - For Science, verify factual correctness and that the prompt substantively measures the stated expectation, not just a neighboring idea. When science-expectations.js is supplied, treat it as an answerless expectation dictionary, not as proof that an item aligns.
          - For standard alignment, independently consult current official Missouri DESE standards/item specifications when the code's meaning is not already clear from supplied official context.
          - Do not blanket-pass a family of similar items.

          Do not modify IDs, item content, metadata, order, or top-level fields. Write valid JSON back to the same chunk file and do not stop until every review object in that chunk is complete.
          EOF
      - name: Blind independent item review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN="/tmp/map-cleanroom-$ASSESSMENT"
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          lock_source
          for chunk in chunk-*.json; do
            echo "[$ASSESSMENT] reviewing $chunk"
            copilot -s --no-ask-user \
              --allow-tool='read,write,web_fetch,web_search' \
              --allow-url=https://dese.mo.gov \
              --deny-url=github.com --deny-url=api.github.com \
              -p "Read REVIEWER.md, OFFICIAL_CONTEXT.md, $chunk, and science-expectations.js if it exists. Independently review every item exactly as instructed and write all completed review objects back into $chunk."
          done
          python - <<'PY'
          import json, os, pathlib, sys
          assessment=os.environ['ASSESSMENT']
          root=pathlib.Path('/tmp')/f'map-cleanroom-{assessment}'
          full=json.loads((root/'full.json').read_text())
          reviews={}
          for p in sorted(root.glob('chunk-*.json')):
              d=json.loads(p.read_text())
              for item in d['items']:
                  reviews[item['id']]=item.get('review')
          missing=[]
          for item in full['items']:
              r=reviews.get(item['id'])
              if not r:
                  missing.append(item['id']); continue
              item['review']=r
              required=['reviewerAnswer','correctnessVerdict','ambiguityVerdict','gradeFitVerdict','standardAlignmentVerdict']
              if any(r.get(k) in (None,'') for k in required): missing.append(item['id'])
              if any(r.get(k) not in ('pass','finding') for k in required[1:]): missing.append(item['id'])
              if 'finding' in [r.get(k) for k in required[1:]] and not str(r.get('notes','')).strip(): missing.append(item['id'])
          if missing:
              print('Incomplete/invalid blind output:',sorted(set(missing)),file=sys.stderr); sys.exit(2)
          (root/'completed-blind.json').write_text(json.dumps(full,indent=2,ensure_ascii=False)+'\n')
          PY
          unlock_source
          trap - EXIT
      - name: Seal blind phase
        run: |
          set -euo pipefail
          CLEAN="/tmp/map-cleanroom-$ASSESSMENT"
          node scripts/seal-clean-room-review.mjs "$CLEAN/completed-blind.json" > "$CLEAN/sealed.json"
      - name: Post-blind manual rubric review when applicable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN="/tmp/map-cleanroom-$ASSESSMENT"
          COUNT=$(node -e "const d=require('$CLEAN/sealed.json'); console.log((d.manualRubrics||[]).length)")
          if [[ "$COUNT" == "0" ]]; then
            echo "No manual rubrics for $ASSESSMENT"
            exit 0
          fi
          cat > "$CLEAN/RUBRIC_REVIEWER.md" <<'EOF'
          The blind phase is already sealed. Auto-scored answer keys and rationales are still unavailable. Review ONLY manualRubrics in sealed.json against the corresponding prompt and independently committed reviewerAnswer inside blindReview. Set review.manualRubricVerdict to exactly pass or finding and add concise notes for every finding. Pass only when the rubric captures scientifically/content-correct response requirements, is fair for the stated points, unambiguous, and grade appropriate. Do not modify blindReview, its fingerprint, rubric text, IDs, points, or any other field. Do not access GitHub/source repository files.
          EOF
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          lock_source
          copilot -s --no-ask-user \
            --allow-tool='read,write' \
            --deny-url=github.com --deny-url=api.github.com \
            -p "Read RUBRIC_REVIEWER.md and sealed.json. Complete every manualRubrics review exactly as instructed and write the result back to sealed.json."
          python - <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path('/tmp')/f"map-cleanroom-{os.environ['ASSESSMENT']}"/'sealed.json'
          d=json.loads(p.read_text())
          bad=[x['id'] for x in d.get('manualRubrics',[]) if x.get('review',{}).get('manualRubricVerdict') not in ('pass','finding') or (x.get('review',{}).get('manualRubricVerdict')=='finding' and not str(x.get('review',{}).get('notes','')).strip())]
          if bad:
              print('Incomplete manual-rubric review:',bad,file=sys.stderr); sys.exit(2)
          PY
          unlock_source
          trap - EXIT
      - name: Reconcile independent review
        run: |
          set +e
          CLEAN="/tmp/map-cleanroom-$ASSESSMENT"
          node scripts/reconcile-clean-room-review.mjs "$CLEAN/sealed.json" > "$CLEAN/reconciliation.json"
          code=$?
          echo "RECON_CODE=$code" >> "$GITHUB_ENV"
          cat "$CLEAN/reconciliation.json"
          exit 0
      - name: Upload clean-room evidence
        uses: actions/upload-artifact@v4
        with:
          name: clean-room-${{ matrix.assessment }}
          path: |
            /tmp/map-cleanroom-${{ matrix.assessment }}/completed-blind.json
            /tmp/map-cleanroom-${{ matrix.assessment }}/sealed.json
            /tmp/map-cleanroom-${{ matrix.assessment }}/reconciliation.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce reconciliation
        run: test "$RECON_CODE" = "0"
