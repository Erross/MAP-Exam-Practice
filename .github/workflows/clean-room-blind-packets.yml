name: Clean-room blind packets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/clean-room-blind-packets.yml
      - scripts/clean-room-manifest.mjs
      - scripts/clean-room-review-template.mjs
      - data/**
      - js/banks.js
      - js/config.js

permissions:
  contents: read

jobs:
  packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate answerless review worksheets
        run: |
          set -euo pipefail
          mkdir -p /tmp/map-blind-packets
          for id in g3-ela g3-math g4-ela g4-math g5-ela g5-math g5-science g6-ela g6-math g7-ela g7-math g8-ela g8-math g8-science; do
            node scripts/clean-room-review-template.mjs --assessment="$id" > "/tmp/map-blind-packets/$id.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: map-blind-packets
          path: /tmp/map-blind-packets/*.json
          if-no-files-found: error
          retention-days: 30
