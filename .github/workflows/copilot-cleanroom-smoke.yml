name: Clean-room Copilot smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/copilot-cleanroom-smoke.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm install -g @github/copilot
      - name: Review one blind item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN=/tmp/cleanroom-smoke
          mkdir -p "$CLEAN"
          node scripts/clean-room-review-template.mjs --assessment=g5-science > "$CLEAN/full.json"
          python - <<'PY'
          import json
          p='/tmp/cleanroom-smoke/full.json'
          d=json.load(open(p)); d['items']=d['items'][:1]
          json.dump(d,open('/tmp/cleanroom-smoke/item.json','w'),indent=2)
          PY
          cat > "$CLEAN/INSTRUCTIONS.md" <<'EOF'
          Independently solve the single Grade 5 Science item in item.json. You have no access to an answer key. Edit only its review object: reviewerAnswer must be the exact displayed correct option/value; set correctnessVerdict, ambiguityVerdict, gradeFitVerdict, and standardAlignmentVerdict to pass or finding; notes are required for any finding. Do not access GitHub or parent/source repository files. Write valid JSON back to item.json.
          EOF
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          lock_source
          copilot -s --no-ask-user --allow-tool='read,write' --deny-url=github.com --deny-url=api.github.com -p "Read INSTRUCTIONS.md and item.json. Complete the independent review and write it back to item.json."
          python - <<'PY'
          import json,sys
          d=json.load(open('/tmp/cleanroom-smoke/item.json')); r=d['items'][0]['review']
          req=['reviewerAnswer','correctnessVerdict','ambiguityVerdict','gradeFitVerdict','standardAlignmentVerdict']
          if any(r.get(k) in (None,'') for k in req): sys.exit('review incomplete')
          print(json.dumps({'id':d['items'][0]['id'],'review':r},indent=2))
          PY
          unlock_source
          trap - EXIT
