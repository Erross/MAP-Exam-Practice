name: Export exact working tree

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-working-tree.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack source tree
        run: tar --exclude=.git -czf /tmp/map-working-tree.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: map-working-tree
          path: /tmp/map-working-tree.tgz
          if-no-files-found: error
          retention-days: 7
