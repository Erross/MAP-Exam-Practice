name: G5 Science post-blind keyed manifest

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g5-science-keyed-reconcile.yml
      - evidence/clean-room/g5-science-round1-blind.json
      - scripts/clean-room-manifest.mjs
      - data/grade-5/**
      - js/banks.js

permissions:
  contents: read

jobs:
  keyed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate keyed manifest after frozen blind receipt
        run: node scripts/clean-room-manifest.mjs --assessment=g5-science --answers > /tmp/g5-science-keyed.json
      - uses: actions/upload-artifact@v4
        with:
          name: g5-science-keyed
          path: /tmp/g5-science-keyed.json
          if-no-files-found: error
          retention-days: 7
