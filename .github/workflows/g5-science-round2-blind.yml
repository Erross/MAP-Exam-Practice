name: G5 Science round 2 blind worksheet

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g5-science-round2-blind.yml

permissions:
  contents: read

jobs:
  worksheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate exact browser-effective answerless worksheet
        run: node scripts/clean-room-review-template.mjs --assessment=g5-science > /tmp/g5-science-round2-blind.json
      - uses: actions/upload-artifact@v4
        with:
          name: g5-science-round2-blind
          path: /tmp/g5-science-round2-blind.json
          if-no-files-found: error
          retention-days: 30
