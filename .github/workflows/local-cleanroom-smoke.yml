name: Local clean-room reviewer smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/local-cleanroom-smoke.yml
      - scripts/clean-room-review-template.mjs
      - scripts/clean-room-manifest.mjs
      - data/**
      - js/banks.js

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate two-item blind packet
        run: |
          set -euo pipefail
          mkdir -p /tmp/local-cleanroom
          node scripts/clean-room-review-template.mjs --assessment=g3-math > /tmp/local-cleanroom/full.json
          python - <<'PY'
          import json
          p='/tmp/local-cleanroom/full.json'
          d=json.load(open(p))
          out={k:v for k,v in d.items() if k!='items'}
          out['items']=d['items'][:2]
          json.dump(out,open('/tmp/local-cleanroom/items.json','w'),indent=2)
          PY
          cat > /tmp/local-cleanroom/schema.json <<'EOF'
          {
            "type":"object",
            "properties":{
              "reviews":{
                "type":"array","minItems":2,"maxItems":2,
                "items":{
                  "type":"object",
                  "properties":{
                    "id":{"type":"string"},
                    "reviewerAnswerJson":{"type":"string"},
                    "correctnessVerdict":{"type":"string","enum":["pass","finding"]},
                    "ambiguityVerdict":{"type":"string","enum":["pass","finding"]},
                    "gradeFitVerdict":{"type":"string","enum":["pass","finding"]},
                    "standardAlignmentVerdict":{"type":"string","enum":["pass","finding"]},
                    "notes":{"type":"string"}
                  },
                  "required":["id","reviewerAnswerJson","correctnessVerdict","ambiguityVerdict","gradeFitVerdict","standardAlignmentVerdict","notes"],
                  "additionalProperties":false
                }
              }
            },
            "required":["reviews"],"additionalProperties":false
          }
          EOF
          cat > /tmp/local-cleanroom/prompt.txt <<'EOF'
          You are an independent clean-room reviewer. You did not author these Missouri Grade 3 Math practice items and you have no answer key, scoring object, rationale, prior audit, or author conclusion. Solve each item independently from the visible prompt/options/data. Judge factual/mathematical correctness, ambiguity, Grade 3 appropriateness, and whether the task appears substantively aligned to its stated standard. Do not blanket-pass.

          For reviewerAnswerJson, write a JSON-encoded value as a STRING: e.g. a multiple-choice answer is "\"exact option text\"", a numeric answer is "12", an array answer is "[\"a\",\"b\"]", and an object answer is "{\"x\":1,\"y\":2}". Use exactly pass or finding for each verdict. Any finding requires a concise note. Return only the schema-conforming JSON object.
          EOF
          cat /tmp/local-cleanroom/items.json >> /tmp/local-cleanroom/prompt.txt
      - name: Run isolated Qwen reviewer locally
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLEAN=/tmp/local-cleanroom
          cd "$CLEAN"
          lock_source(){ find "$SOURCE" -type f -exec chmod a-r {} +; }
          unlock_source(){ find "$SOURCE" -type f -exec chmod u+r {} + || true; }
          trap unlock_source EXIT
          lock_source
          curl -LsSf https://llama.app/install.sh | sh
          llama cli -hf Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M \
            --no-display-prompt --temp 0.1 -c 8192 -n 1200 \
            -jf schema.json -f prompt.txt > output.json
          unlock_source
          trap - EXIT
      - name: Validate independent output
        run: |
          python - <<'PY'
          import json
          items=json.load(open('/tmp/local-cleanroom/items.json'))['items']
          out=json.load(open('/tmp/local-cleanroom/output.json'))
          reviews=out['reviews']
          assert len(reviews)==len(items)
          assert [r['id'] for r in reviews]==[i['id'] for i in items]
          for r in reviews:
              json.loads(r['reviewerAnswerJson'])
              for k in ['correctnessVerdict','ambiguityVerdict','gradeFitVerdict','standardAlignmentVerdict']:
                  assert r[k] in ('pass','finding')
              if 'finding' in [r[k] for k in ['correctnessVerdict','ambiguityVerdict','gradeFitVerdict','standardAlignmentVerdict']]:
                  assert r['notes'].strip()
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-cleanroom-smoke
          path: /tmp/local-cleanroom/output.json
          if-no-files-found: error
          retention-days: 7
