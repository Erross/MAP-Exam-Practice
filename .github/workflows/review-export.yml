name: Review export
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/review-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: tar --exclude=.git -czf /tmp/map-review-tree.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: map-review-tree
          path: /tmp/map-review-tree.tgz
          retention-days: 2
