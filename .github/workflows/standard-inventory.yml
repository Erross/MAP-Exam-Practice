name: MAP standard inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/standard-inventory.yml
      - scripts/standard-inventory.mjs
      - data/**
      - js/banks.js

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Build browser-effective standard inventory
        run: node scripts/standard-inventory.mjs > /tmp/map-standard-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: map-standard-inventory
          path: /tmp/map-standard-inventory.json
          if-no-files-found: error
          retention-days: 7
